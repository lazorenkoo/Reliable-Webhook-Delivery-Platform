services:
  app:
    build: .
    image: relayforge:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-relayforge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-relayforge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-relayforge}
      RELAYFORGE_API_KEY: ${RELAYFORGE_API_KEY:?Set RELAYFORGE_API_KEY in your environment or .env}
      RELAYFORGE_WEBHOOK_HOSTS: ${RELAYFORGE_WEBHOOK_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relayforge}
      POSTGRES_USER: ${POSTGRES_USER:-relayforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relayforge}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
