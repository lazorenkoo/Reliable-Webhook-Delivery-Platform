spring.application.name=RelayForge
spring.datasource.url=jdbc:postgresql://localhost:5432/relayforge
spring.datasource.username=relayforge
spring.datasource.password=relayforge
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
relayforge.api-key=${RELAYFORGE_API_KEY:}
relayforge.webhooks.allowed-hosts=${RELAYFORGE_WEBHOOK_HOSTS:}
relayforge.webhooks.proxy-host=${RELAYFORGE_WEBHOOK_PROXY_HOST:}
relayforge.webhooks.proxy-port=${RELAYFORGE_WEBHOOK_PROXY_PORT:3128}
